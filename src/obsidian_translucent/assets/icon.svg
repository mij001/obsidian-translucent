<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Obsidian Translucent</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a41"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="glassA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".95"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="glassB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".95"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="tile"><rect x="24" y="24" width="464" height="464" rx="104"/></clipPath>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- two overlapping panes of frosted glass -->
    <circle cx="204" cy="236" r="132" fill="url(#glassA)"/>
    <circle cx="308" cy="276" r="132" fill="url(#glassB)" style="mix-blend-mode:screen"/>
    <!-- the overlap, a lens where both show through -->
    <path d="M256 150a132 132 0 0 1 0 252a132 132 0 0 1 0-252z" fill="#fff" fill-opacity=".22"/>
    <!-- blurred glow behind, as if the desktop shows through -->
    <circle cx="256" cy="400" r="150" fill="#38bdf8" opacity=".25" filter="url(#soft)"/>
    <!-- top sheen -->
    <rect x="24" y="24" width="464" height="190" fill="url(#shine)" opacity=".5"/>
  </g>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3"/>
</svg>
